services:
  - type: web
    name: agriprice-malawi
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend crop_intelligence.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

